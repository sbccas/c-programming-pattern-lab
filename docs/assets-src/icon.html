<!doctype html>
<html><head><meta charset="utf-8" />
<style>

  html, body { width: 100vw; height: 100vh; overflow: hidden; }

  body { background: radial-gradient(circle at 30% 20%, #142048, #080a18 70%); display: grid; place-items: center; }
  svg { width: 62vw; height: 62vw; filter: drop-shadow(0 0 4vw rgba(34,227,255,.55)); }
</style></head>

</body></html>
